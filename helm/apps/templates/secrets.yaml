{{- /* helm/apps/templates/secrets.yaml */ -}}
# Application-layer secrets for notification and ingestion services
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: crypto-analytics
    component: notification
type: Opaque
data:
  SMTP_HOST: {{ (.Values.notificationService.env.SMTP_HOST | default "smtp.gmail.com") | b64enc | quote }}
  SMTP_PORT: {{ (.Values.notificationService.env.SMTP_PORT | default "587") | b64enc | quote }}
  SMTP_USER: {{ (.Values.notificationService.env.SMTP_USER | default "your_email@gmail.com") | b64enc | quote }}
  SMTP_PASSWORD: {{ (.Values.notificationService.env.SMTP_PASSWORD | default "your_app_password_here") | b64enc | quote }}
  EMAIL_FROM: {{ (.Values.notificationService.env.EMAIL_FROM | default "alerts@crypto-analytics.io") | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: binance-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app: crypto-analytics
    component: ingestion
type: Opaque
data:
  api-key: {{ (.Values.ingestion.env.BINANCE_API_KEY | default "your_binance_api_key_here") | b64enc | quote }}
  api-secret: {{ (.Values.ingestion.env.BINANCE_API_SECRET | default "your_binance_api_secret_here") | b64enc | quote }}
