{{- /* helm/infra/templates/secrets.yaml */ -}}
# Infrastructure secrets for MongoDB and MinIO
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app: crypto-analytics
    component: mongodb
type: Opaque
data:
  root-username: {{ .Values.mongodb.auth.rootPassword | default "root" | b64enc | quote }}
  root-password: {{ .Values.mongodb.auth.rootPassword | default "changeme" | b64enc | quote }}
  uri: {{ printf "mongodb://%s:%s@mongodb:27017" (.Values.mongodb.auth.username | default "root") (.Values.mongodb.auth.rootPassword | default "changeme") | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app: crypto-analytics
    component: minio
type: Opaque
data:
  root-user: {{ .Values.minio.auth.rootUser | default "admin" | b64enc | quote }}
  root-password: {{ .Values.minio.auth.rootPassword | default "password" | b64enc | quote }}
  access-key: {{ .Values.minio.auth.rootUser | default "admin" | b64enc | quote }}
  secret-key: {{ .Values.minio.auth.rootPassword | default "password" | b64enc | quote }}
